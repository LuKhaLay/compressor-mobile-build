
name: Build Compressor 1.6.5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        shell: bash
        run: |
          set -e

          sdkmanager --install "platforms;android-37"
          sdkmanager --licenses

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "Using source: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Fix H264 Software Encoder
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/compress/joshattic/us/viewmodel/CompressorViewModel.kt"

          if [ ! -f "$FILE" ]; then
            echo "CompressorViewModel.kt not found"
            exit 1
          fi

          sed -i 's/\.softwareOnly/\.isSoftwareOnly/g' "$FILE"

          echo "H264 encoder property checked:"
          grep -n 'isSoftwareOnly' "$FILE" || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Compressor-1.6.5-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
