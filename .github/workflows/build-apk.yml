
name: Build Compressor 1.6.5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        shell: bash
        run: |
          sdkmanager --install "platforms;android-37.0"
          sdkmanager --licenses

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -d "$SDK/platforms/android-37.0" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          else
            echo "Android API 37.0 installation failed"
            exit 1
          fi

      - name: Extract Source ZIP
        shell: bash
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Compressor-1.6.5-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
